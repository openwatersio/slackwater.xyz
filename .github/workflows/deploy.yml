# Publish slackwater.xyz on merge.
#
# Until this existed the site was deployed by hand, and it showed: /privacy and
# the Plausible script were both merged to main while the apex still served a
# build from before either one.
#
# Needs a CLOUDFLARE_API_TOKEN repo secret with Workers Scripts -> Edit and
# Workers KV -> Edit. A Zone Read + DNS Edit token will NOT do — see
# CONTRIBUTING.md "Deploying".
#
# Three jobs, so the token never shares a runner with the site's dependencies
# or anything they write:
# - `build` runs npm ci, the build, the tests and the IndexNow plan with no
#   secret, and hands the built site on as an artifact.
# - `deploy` checks out only reviewed files (tools/deploy, its config check,
#   wrangler.jsonc and mise.toml), installs wrangler from tools/deploy's own
#   lockfile under the same .npmrc rules, refuses a built Worker config that
#   isn't the reviewed one (tools/deploy/check-config.mjs: a `build` command
#   would run beside the token, and another name, route or binding would point
#   it elsewhere), and only then publishes with the token.
# - `indexnow` submits the plan after the deploy, again with no secret.
# The built site itself is what a compromised build could still change, and it
# is what gets published; the split keeps the token from being read or aimed
# elsewhere, not the site from being altered.
name: Deploy

on:
  push:
    branches: [main]
  # Every prerendered page is dated the build clock (`__BUILD_NOW__`), so an
  # undeployed day is a day of stale dates for every reader without JS. 09:15
  # UTC is after midnight Pacific year round.
  schedule:
    - cron: '15 9 * * *'
  # Manual re-publish, for a rollback or after rotating the token.
  workflow_dispatch:

# A queued deploy for an older commit has nothing useful to say once a newer
# one is running, but let the in-flight one finish rather than leaving the
# Worker half-published.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Full history: the sitemap dates each non-station page by the last
      # commit to its source (vite.config.ts), and a shallow clone has one.
      # No credentials left in .git/config for the steps after it.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: mise.toml
          cache: npm

      - run: npm ci

      # Build first: the route and bundle-size tests assert against the
      # prerendered output in .output/public.
      - run: npm run build

      # After the build, not before it: src/routeTree.gen.ts is gitignored and
      # only exists as a vite build side effect, so tsc on a fresh checkout
      # fails with "Cannot find module './routeTree.gen'" - a missing file,
      # not a type error. The job still fails on a real one.
      - run: npm run typecheck

      - run: npm test
      - run: npm run test:agents

      # Before the deploy, while the live sitemaps still describe the previous
      # one. Never blocks the deploy; a failure leaves no plan to submit.
      - name: Plan IndexNow submission
        continue-on-error: true
        run: node tools/indexnow.mjs plan indexnow-urls.txt

      # The artifact leaves hidden files out, so one the site needs (a
      # .well-known file, a .assetsignore) would vanish from the deploy
      # silently. The prerender server's local state is the only one expected.
      - name: Check the build leaves no hidden file to lose
        run: |
          hidden=$(find .output -mindepth 1 -name '.*' -not -path '.output/server/.wrangler' -not -path '.output/server/.wrangler/*')
          [ -z "$hidden" ] || { echo "::error::hidden files the artifact would drop: $hidden"; exit 1; }

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: site
          path: .output/
          retention-days: 1
          if-no-files-found: error

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: indexnow
          path: indexnow-urls.txt
          retention-days: 1
          if-no-files-found: ignore

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Reviewed files from this commit only, never the site's dependencies.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/deploy
            src/lib/deploy-config.ts
            wrangler.jsonc
            mise.toml
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: mise.toml
          cache: npm
          cache-dependency-path: tools/deploy/package-lock.json

      # From tools/deploy's lockfile, with its .npmrc's age floor and script
      # allowlist, and before the token is anywhere on this runner.
      - run: npm ci
        working-directory: tools/deploy

      - uses: actions/download-artifact@v8.0.2
        with:
          name: site
          path: .output

      - run: node tools/deploy/check-config.mjs wrangler.jsonc .output/server/wrangler.json

      # wrangler-action finds the wrangler installed above and runs it.
      #
      # Nitro rewrites the root wrangler.jsonc into the deployable config; the
      # root file is the source and is not deployable on its own.
      - uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: tools/deploy
          command: deploy -c ../../.output/server/wrangler.json

  # After the deploy, so an engine that fetches at once gets the new pages. A
  # plan the build changed could list other URLs; IndexNow accepts only
  # slackwater.xyz's, against the key file the site serves.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: mise.toml

      # Absent when the plan failed, which leaves nothing to submit.
      - uses: actions/download-artifact@v8.0.2
        continue-on-error: true
        with:
          name: indexnow

      - name: Submit to IndexNow
        run: '[ ! -f indexnow-urls.txt ] || node tools/indexnow.mjs submit indexnow-urls.txt'
