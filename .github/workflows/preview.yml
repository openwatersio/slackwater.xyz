# Publish a preview of a PR so it can be reviewed by looking at it.
#
# `wrangler versions upload` uploads the Worker as a new version WITHOUT routing
# any production traffic to it — the apex and www keep serving whatever was last
# deployed. `preview_urls: true` in wrangler.jsonc is what makes the version
# reachable, and `--preview-alias pr-<n>` gives it a stable URL that survives a
# force-push, so the PR comment never goes stale.
#
# Uses the same CLOUDFLARE_API_TOKEN secret as Deploy. Secrets aren't exposed to
# pull_request runs from forks, so the upload fails on one — outside
# contributions aren't sought here (README.md). Dependabot runs are restricted
# the same way and get their own secret store, so the upload is skipped for them
# rather than run with an empty token; see the job.
#
# Two jobs, as in Deploy, so the token never shares a runner with the site's
# dependencies or anything they write: `preview` runs npm ci, the build and the
# tests with no secret and hands the built site on as an artifact; `upload`
# installs wrangler from tools/deploy's own lockfile, refuses a built Worker
# config that isn't the reviewed one, and only then publishes with the token.
#
# The build job keeps the name `preview`: the main branch ruleset requires that
# check. A skipped job passes a required check, so the name stays on the job
# that runs the tests, not on the upload, which is skipped when they fail.
name: Preview

on:
  pull_request:

# A preview for an older commit on the same PR is worth nothing once a newer one
# is building; unlike a deploy, nothing is left half-published if it's killed.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      # No credentials left in .git/config for the steps after it.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: mise.toml
          cache: npm

      - run: npm ci

      # "ERROR [nitro] Preview server exited with code 143" here is normal — see
      # CONTRIBUTING.md "Gotchas". The step's exit code is what matters.
      - run: npm run build

      # The build regenerates public/_redirects (vite.config.ts), and the
      # committed copy is how a redirect change gets reviewed. A difference
      # means the PR changed redirects without committing the result.
      - name: Check public/_redirects is committed as built
        run: git diff --exit-code -- public/_redirects

      # After the build, not before it: src/routeTree.gen.ts is gitignored and
      # only exists as a vite build side effect, so tsc on a fresh checkout
      # fails with "Cannot find module './routeTree.gen'" - a missing file,
      # not a type error. The job still fails on a real one.
      - run: npm run typecheck

      # A PR that breaks the test suite went green until this ran only in
      # Deploy, i.e. after merge. After the build for the same generated-file
      # reason as typecheck above: the route tests assert against .output/public.
      - run: npm test
      - run: npm run test:agents

      # The artifact leaves hidden files out, so one the site needs (a
      # .well-known file, a .assetsignore) would vanish from the deploy
      # silently. The prerender server's local state is the only one expected.
      - name: Check the build leaves no hidden file to lose
        run: |
          hidden=$(find .output -mindepth 1 -name '.*' -not -path '.output/server/.wrangler' -not -path '.output/server/.wrangler/*')
          [ -z "$hidden" ] || { echo "::error::hidden files the artifact would drop: $hidden"; exit 1; }

      # Dependabot's runs upload nothing, so they store nothing.
      - uses: actions/upload-artifact@v7.0.2
        if: github.actor != 'dependabot[bot]'
        with:
          name: site
          path: .output/
          retention-days: 1
          if-no-files-found: error

  # Dependabot's runs read Dependabot's secrets, not the repository's, so
  # CLOUDFLARE_API_TOKEN arrives empty and wrangler stops on it — a red
  # check on a green build. The fix is not to copy the token into that
  # store: a dependency PR is the one place where `npm ci` runs code
  # this repo has not seen, and the cooldown in dependabot.yml exists
  # because we would rather miss a release than install it. A bump is
  # reviewed by its diff and its build; there is nothing to look at.
  upload:
    needs: preview
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Files from this PR's commit only, never the site's dependencies.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/deploy
            src/lib/deploy-config.ts
            wrangler.jsonc
            mise.toml
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: mise.toml
          cache: npm
          cache-dependency-path: tools/deploy/package-lock.json

      # From tools/deploy's lockfile, with its .npmrc's age floor and script
      # allowlist, and before the token is anywhere on this runner.
      - run: npm ci
        working-directory: tools/deploy

      - uses: actions/download-artifact@v8.0.2
        with:
          name: site
          path: .output

      - run: node tools/deploy/check-config.mjs wrangler.jsonc .output/server/wrangler.json

      # wrangler-action finds the wrangler installed above and runs it. The
      # build is of this PR's head merged into its base, as pull_request
      # checks out, so the message names both.
      - id: upload
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: tools/deploy
          command: >-
            versions upload -c ../../.output/server/wrangler.json
            --preview-alias pr-${{ github.event.pull_request.number }}
            --message "PR #${{ github.event.pull_request.number }}, head ${{ github.event.pull_request.head.sha }} merged into its base"

      # Wrangler prints the URLs to stderr; both streams are read in case that
      # moves. The alias host carries the account subdomain
      # (pr-21-slackwater-xyz.<account>.workers.dev), so the character class
      # has to allow dots.
      - id: url
        env:
          PR: ${{ github.event.pull_request.number }}
          OUT: ${{ steps.upload.outputs.command-output }}
          ERR: ${{ steps.upload.outputs.command-stderr }}
        run: |
          url=$(printf '%s\n%s\n' "$ERR" "$OUT" | grep -m1 -oE "https://pr-$PR-[a-z0-9.-]+\.workers\.dev" || true)
          [ -n "$url" ] || { echo "::error::no preview alias URL in wrangler output"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment the preview URL
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.url.outputs.url }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none \
            --body "Preview: $URL — built from ${HEAD::7} merged into $BASE."
