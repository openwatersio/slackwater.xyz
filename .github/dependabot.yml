version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # `.npmrc` keeps npm from resolving a release younger than a day, and this
    # keeps Dependabot from proposing one younger than three. Waiting is the
    # point: a compromised release is usually yanked within days, and this
    # site would rather miss it than install it.
    cooldown:
      default-days: 3
    # One PR a week for the routine bumps, not one per package. Nine open PRs is
    # nine lockfiles that each conflict with the last one merged; a single branch
    # resolves once and gets one `npm run build` to prove it.
    #
    # Unrelated majors stay out of it and arrive one at a time. The first grouped run put
    # `station-metadata` 4 -> 5 in with wrangler and marked, and that major is not
    # a bump: it takes the corpus from 3,640 pages to 7,349 and renames station
    # contexts, which is a week of copy and a prerender-cost decision, not a merge.
    # A grouped PR that always fails is a grouped PR nobody reads.
    groups:
      # Vitest companions have matching peer versions, including across majors.
      vitest:
        patterns:
          - vitest
          - '@vitest/*'
      vitest-security:
        applies-to: security-updates
        patterns:
          - vitest
          - '@vitest/*'
      npm:
        update-types:
          - minor
          - patch
        patterns:
          - '*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        update-types:
          - minor
          - patch
        patterns:
          - '*'
