allowBuilds:
  esbuild: true
  lightningcss: true
  workerd: true

minimumReleaseAgeExclude:
  - '@slackwater/database@1.0.0-beta.20261009'
  - '@slackwater/engine@1.0.0-beta.5'

# unstorage@2 alpha (pulled in by nitro) imports destr without declaring it.
# Under pnpm's strict node_modules that resolves to nothing and the vite config
# fails to load. Declare it on unstorage's behalf rather than hoisting the world.
packageExtensions:
  unstorage:
    dependencies:
      destr: ^2.0.5
